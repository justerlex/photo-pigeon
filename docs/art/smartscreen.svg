<!--
  The wall, drawn. Copied out of the welcome screen in app/ui/setup.html, which
  is still the original: the geometry here is the same geometry, with the CSS
  classes in app/ui/pigeon.css resolved into attributes so the file stands on its
  own inside a README. Redraw it there first, then bring it back here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240" role="img" aria-labelledby="title">
  <title id="title">The Windows SmartScreen box, with More info first and Run anyway second</title>

  <rect x="0.5" y="0.5" width="359" height="239" rx="6" fill="#f1f1ec" stroke="#8a8f98" stroke-opacity="0.34" />

  <g transform="translate(20 20)" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="11">
    <g fill="none" stroke="#8a8f98" stroke-width="1.5">
      <rect x="30" y="16" width="260" height="148" rx="6" />
      <line x1="30" y1="44" x2="290" y2="44" />
      <rect x="158" y="134" width="72" height="22" rx="3" />
    </g>

    <g fill="#8a8f98" fill-opacity="0.34">
      <rect x="46" y="26" width="86" height="8" rx="2" />
      <rect x="46" y="60" width="150" height="9" rx="2" />
      <rect x="46" y="78" width="196" height="6" rx="2" />
      <rect x="46" y="90" width="158" height="6" rx="2" />
    </g>

    <g fill="#c6382e">
      <circle cx="52" cy="117" r="8" />
      <circle cx="52" cy="145" r="8" />
    </g>
    <rect x="66" y="134" width="80" height="22" rx="3" fill="none" stroke="#c6382e" stroke-width="2" />

    <g fill="#c6382e" font-weight="600">
      <text x="68" y="121">More info</text>
      <text x="106" y="149" text-anchor="middle">Run anyway</text>
    </g>
    <g fill="#fafaf7" font-weight="600" text-anchor="middle">
      <text x="52" y="121">1</text>
      <text x="52" y="149">2</text>
    </g>
    <text x="194" y="149" text-anchor="middle" fill="#4a515b" font-weight="500">Do not run</text>
  </g>

  <text x="180" y="224" text-anchor="middle" fill="#8a8f98" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12">A diagram, not a screenshot of Windows.</text>
</svg>
