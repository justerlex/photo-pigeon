<!--
  The page Google shows once, drawn. Copied out of the walk screen in
  app/ui/setup.html, which is still the original: the geometry here is the same
  geometry, with the CSS classes in app/ui/pigeon.css resolved into attributes so
  the file stands on its own inside a README. Redraw it there first, then bring
  it back here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="360" height="260" role="img" aria-labelledby="title">
  <title id="title">Google's unverified app page, with Advanced first and the link underneath second</title>

  <rect x="0.5" y="0.5" width="359" height="259" rx="6" fill="#f1f1ec" stroke="#8a8f98" stroke-opacity="0.34" />

  <g transform="translate(20 20)" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="11">
    <g fill="none" stroke="#8a8f98" stroke-width="1.5">
      <rect x="10" y="10" width="300" height="180" rx="6" />
      <line x1="10" y1="38" x2="310" y2="38" />
      <path d="M 44,58 l 12,22 h -24 z" />
      <line x1="44" y1="66" x2="44" y2="72" />
    </g>

    <g fill="#8a8f98" fill-opacity="0.34">
      <circle cx="26" cy="24" r="3.5" />
      <circle cx="38" cy="24" r="3.5" />
      <circle cx="50" cy="24" r="3.5" />
      <rect x="70" y="20" width="200" height="9" rx="4.5" />
      <rect x="72" y="58" width="180" height="9" rx="2" />
      <rect x="72" y="76" width="212" height="6" rx="2" />
      <rect x="72" y="88" width="168" height="6" rx="2" />
    </g>

    <g fill="#c6382e">
      <circle cx="42" cy="122" r="8" />
      <circle cx="42" cy="160" r="8" />
    </g>
    <g fill="none" stroke="#c6382e" stroke-width="2">
      <rect x="58" y="111" width="76" height="22" rx="3" />
      <line x1="58" y1="169" x2="212" y2="169" />
    </g>

    <g fill="#c6382e" font-weight="600">
      <text x="96" y="126" text-anchor="middle">Advanced</text>
      <text x="58" y="164">Go to Photo Pigeon (unsafe)</text>
    </g>
    <g fill="#fafaf7" font-weight="600" text-anchor="middle">
      <text x="42" y="126">1</text>
      <text x="42" y="164">2</text>
    </g>
  </g>

  <text x="180" y="244" text-anchor="middle" fill="#8a8f98" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12">A diagram, not a screenshot of Google.</text>
</svg>
