<!--
  Where the pigeon went, drawn. Copied out of the finish screen in
  app/ui/setup.html, which is still the original: the geometry here is the same
  geometry, with the CSS classes in app/ui/pigeon.css resolved into attributes so
  the file stands on its own inside a README. Redraw it there first, then bring
  it back here.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250" width="360" height="250" role="img" aria-labelledby="title">
  <title id="title">The Windows 11 tray overflow: open the arrow, then drag the pigeon onto the taskbar</title>

  <rect x="0.5" y="0.5" width="359" height="249" rx="6" fill="#f1f1ec" stroke="#8a8f98" stroke-opacity="0.34" />

  <g transform="translate(20 20)" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="11">
    <g fill="none" stroke="#8a8f98" stroke-width="1.5">
      <rect x="22" y="50" width="120" height="50" rx="6" />
      <rect x="10" y="146" width="300" height="34" rx="5" />
    </g>

    <g fill="#8a8f98" fill-opacity="0.34">
      <rect x="64" y="66" width="18" height="18" rx="3" />
      <rect x="92" y="66" width="18" height="18" rx="3" />
      <rect x="196" y="158" width="18" height="12" rx="2" />
      <rect x="224" y="158" width="18" height="12" rx="2" />
      <rect x="262" y="159" width="34" height="10" rx="2" />
    </g>

    <g fill="none" stroke="#c6382e" stroke-width="2">
      <rect x="36" y="66" width="18" height="18" rx="3" />
      <path d="M 34,168 l 8,-9 l 8,9" />
      <path stroke-dasharray="5 5" d="M 45,104 C 72,132 118,130 146,150" />
    </g>
    <path d="M 152,154 l -13,-1 l 3,-8 z" fill="#c6382e" />

    <text x="22" y="40" fill="#4a515b" font-weight="500">hidden icons</text>
    <text x="172" y="128" fill="#c6382e" font-weight="600">drag it out</text>
  </g>

  <text x="180" y="234" text-anchor="middle" fill="#8a8f98" font-family="'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif" font-size="12">A diagram, not a screenshot of Windows.</text>
</svg>
